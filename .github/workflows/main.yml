# File: .github/workflows/build.yml
name: Build and Test with WebImage

on:
  push:
    branches:
      - "**"   # run on all branches
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # === Checkout your repository ===
      - name: Checkout code
        uses: actions/checkout@v4

      # === Install GraalVM (Oracle build with WebImage) ===
      # Replace the URL with the actual download link for your GraalVM WebImage distribution
      - name: Download GraalVM WebImage
        run: |
          curl -L -o graalvm-webimage.tar.gz "https://example.com/path/to/graalvm-webimage.tar.gz"
          mkdir -p $HOME/graalvm
          tar -xzf graalvm-webimage.tar.gz -C $HOME/graalvm --strip-components=1
          echo "GRAALVM_BIN=$HOME/graalvm/bin" >> $GITHUB_ENV
          echo "JAVA_HOME_OVERRIDE=$HOME/graalvm" >> $GITHUB_ENV

      # === Run your build script with explicit arguments ===
      - name: Run build script
        run: |
          chmod +x build-script/build.sh
          ./build-script/build.sh "$GRAALVM_BIN" "$JAVA_HOME_OVERRIDE" --skip-tests
