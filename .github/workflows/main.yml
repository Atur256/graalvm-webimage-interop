# File: .github/workflows/build.yml
name: Build and Test with WebImage

on:
  push:
    branches:
      - "**"   # run on all branches
  pull_request: # optional, also run on PRs

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # === Checkout your repository ===
      - name: Checkout code
        uses: actions/checkout@v4

      # === Set up JDK (adjust version to match your pom.xml) ===
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      # === Install GraalVM (if needed for web-image) ===
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 22
          distribution: graalvm
          components: "native-image"

      # === Run your build script ===
      - name: Run build script
        run: |
          chmod +x build-script/build.sh
          ./build-script/build.sh --skip-tests
