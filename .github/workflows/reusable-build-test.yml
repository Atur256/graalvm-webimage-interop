name: Build & Test (GraalVM + Node)

on:
  workflow_call:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Cache GraalVM manually
      - name: Cache GraalVM
        uses: actions/cache@v3
        with:
          path: ${{ runner.tool_cache }}/graalvm
          key: graalvm-25e1-ea-${{ runner.os }}-v1

      # Setup GraalVM
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25e1-ea'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      # Verify GraalVM installation
      - name: Verify GraalVM
        run: |
          java --version
          native-image --version

      # Build with Maven (native image tests)
      - name: Build with Maven
        run: mvn clean package -Ptest-native

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts'  # always latest LTS version

      # Run Node tests
      - name: Run generated Node.js tests
        run: node target/native-tests/tests.js

